<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Report Subscription</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath d=%27M9 1 3 9h4l-1 6 6-8H8z%27 fill=%27%23eda100%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=20260922d">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div class="top-left">
      <p class="eyebrow">Construction Weather &middot; Vineland, NJ</p>
      <h1>Daily report</h1>
      <nav class="topnav top-meta"><a href="./">&larr; Dashboard</a></nav>
    </div>
  </div>
</header>
<main class="wrap doc">
  <section class="panel sub-result">
    <h2 id="sub-title">One moment&hellip;</h2>
    <p id="sub-body" class="muted"></p>
    <p><a class="btn" href="./">Go to the dashboard</a></p>
  </section>
</main>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const token = q.get("confirm") || q.get("unsubscribe");
  const action = q.get("confirm") ? "confirm" : q.get("unsubscribe") ? "unsubscribe" : null;
  const title = document.getElementById("sub-title"), body = document.getElementById("sub-body");
  if (!action || !/^[\w-]{16,}$/.test(token || "")) {
    title.textContent = "Nothing to do here";
    body.textContent = "This link is incomplete. To subscribe, use the form on the dashboard.";
    return;
  }
  try {
    const cfg = await (await fetch("data/public_config.json?v=" + Date.now(), { cache: "no-store" })).json();
    const r = await fetch(cfg.subscribe_url, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, token }) });
    if (!r.ok) throw new Error(r.status);
    history.replaceState(null, "", location.pathname);
    if (action === "confirm") {
      title.textContent = "You're subscribed";
      body.textContent = "Thanks for confirming. The daily Vineland rainfall and lightning report will arrive each morning around 7:30 AM ET, starting with the next report.";
    } else {
      title.textContent = "You've been unsubscribed";
      body.textContent = "You won't receive the daily report any more. You can sign up again from the dashboard at any time.";
    }
  } catch (e) {
    title.textContent = "Something went wrong";
    body.textContent = "We couldn't record that just now. Please try the link again in a minute.";
  }
})();
</script>
</body>
</html>
