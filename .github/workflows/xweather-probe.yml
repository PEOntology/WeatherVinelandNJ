name: Xweather probe

# Diagnostic only: reports which Xweather lightning endpoints the account's
# subscription answers. Separate from the data pipeline so it never waits on it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      XWEATHER_CLIENT_ID: ${{ secrets.XWEATHER_CLIENT_ID }}
      XWEATHER_CLIENT_SECRET: ${{ secrets.XWEATHER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy
      - run: python -m weather.cli xweather-check
      - name: NOAA SWDI NLDN tiles (public daily cloud-to-ground counts)
        if: always()
        run: |
          B="https://www.ncei.noaa.gov/swdiws"
          box="bbox=-75.10,39.37,-74.88,39.58"
          get() { echo "== $1"; curl -sS -m 60 -w "\n[HTTP %{http_code}, %{size_download} bytes]\n" "$1" | head -30; }
          get "$B/csv/nx3tvs/20060505:20060506?bbox=-91,30,-90,31"
          get "$B/csv/nldn-tiles/20230801:20230802"
          get "$B/csv/nldn-tiles/20230801:20230802?$box"
          get "$B/csv/nldn-tiles/20260801:20260802?$box"
          get "$B/csv/nldn-tiles/20260803:20260804?tile=-75.0,39.5"
          get "$B/csv/nldn-tiles/20260801:20260831?$box&stat=count"
          get "$B/csv/nldn-tiles/20250801:20250802?$box"
          get "$B/csv/nldn-tiles/periodOfRecord"
          get "$B/xml/nldn-tiles/20260803:20260804?$box"
