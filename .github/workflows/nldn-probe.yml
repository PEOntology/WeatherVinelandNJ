name: NLDN tiles probe

# Diagnostic: inspect NOAA's monthly NLDN lightning-tile archive files
# (daily cloud-to-ground flash counts on a 0.1-degree grid).
on:
  workflow_dispatch:
    inputs:
      month:
        description: "YYYYMM"
        default: "202608"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Listing
        run: |
          curl -sS -m 60 https://www.ncei.noaa.gov/pub/data/swdi/database-csv/v2/ | grep -o 'nldn-tiles-2026[0-9]*\.csv\.gz[^<]*' | sort -u | head -20
          curl -sS -m 60 https://www.ncei.noaa.gov/pub/data/swdi/database-csv/v2/ | grep -i -A1 'nldn-tiles-2026' | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\} [0-9:]*\|[0-9.]*[KMG]' | head -20 || true
      - name: Download and inspect
        run: |
          f="nldn-tiles-${{ inputs.month }}.csv.gz"
          curl -sS -m 300 -o "$f" -w "HTTP %{http_code}, %{size_download} bytes, type %{content_type}\n" "https://www.ncei.noaa.gov/pub/data/swdi/database-csv/v2/$f"
          file "$f"
          echo "== first 25 lines"; zcat "$f" | head -25
          echo "== line count"; zcat "$f" | wc -l
          python3 - "$f" <<'PY'
          import csv, gzip, sys, collections
          rows = list(csv.reader(gzip.open(sys.argv[1], "rt")))
          hdr_i = next(i for i, r in enumerate(rows) if r and not r[0].startswith("#"))
          print("first data/header row:", rows[hdr_i])
          data = [r for r in rows[hdr_i:] if r and not r[0].startswith("#")]
          print("columns per row:", collections.Counter(len(r) for r in data).most_common(3))
          # guess columns: find fields that look like lat/lon near Vineland
          near = [r for r in data if any(f.strip() in ("-75.1", "-75.0", "-74.9", "-75.10", "-75.00", "-74.90") for f in r)
                  and any(f.strip() in ("39.4", "39.5", "39.40", "39.50", "39.3", "39.30", "39.6") for f in r)]
          print("rows mentioning Vineland-area tile coordinates:", len(near))
          for r in near[:40]:
              print(r)
          dates = sorted({r[0][:10] for r in data if r[0][:4].isdigit()})
          print("date range:", dates[:3], "...", dates[-3:], "n days", len(dates))
          PY
