name: Live lightning collector

# Xweather's standard feed only reaches back 5 minutes, so this job polls it
# every 90 s. Each run polls for ~70 minutes in 10-minute chunks, committing
# the collected flashes to the repo after every chunk so nothing is held only
# on the runner. At the end it starts its own next run (workflow_dispatch),
# so collection continues even if GitHub's cron scheduler is late or silent;
# the hourly cron is a backup. Gaps longer than 5 minutes are measured and
# mark the day incomplete.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      chunks:
        description: "Number of 10-minute polling chunks"
        default: "7"
      chain:
        description: "Start the next run when this one finishes"
        default: "true"

permissions:
  contents: write
  actions: write

concurrency:
  group: live-lightning
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      XWEATHER_CLIENT_ID: ${{ secrets.XWEATHER_CLIENT_ID }}
      XWEATHER_CLIENT_SECRET: ${{ secrets.XWEATHER_CLIENT_SECRET }}
      # Flash coordinates go only to the private Xano archive.
      XANO_META_URL: ${{ vars.XANO_META_URL || secrets.XANO_META_URL }}
      XANO_API_TOKEN: ${{ secrets.XANO_API_TOKEN }}
      XANO_WORKSPACE_ID: ${{ vars.XANO_WORKSPACE_ID || secrets.XANO_WORKSPACE_ID }}
      NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests numpy
      - name: Poll and save every 10 minutes
        id: poll
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          save() {
            git add state/xweather_flash site/data/current.json site/data/status.json
            git add state/xano_flashes_live.json state/xano_ids.json 2>/dev/null || true
            git diff --cached --quiet && return 0
            git commit -q -m "data: live lightning $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3 4 5; do
              git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && return 0
              sleep $((2**i))
            done
            echo "::warning::push failed; data kept for next chunk"
          }
          ok=0
          for i in $(seq 1 "${{ inputs.chunks || '7' }}"); do
            if python -m weather.cli lightning-live --minutes 10; then ok=1; fi
            python -m weather.cli current || true   # keep the site's current conditions fresh
            save
          done
          [ "$ok" = 1 ]
      - name: Start next run
        if: success() && (inputs.chain || 'true') == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run lightning-live.yml --ref "${GITHUB_REF_NAME}"
          # GitHub's cron has been unreliable for this repo, so also kick the hourly
          # data update (which refreshes current conditions and sends the morning report).
          gh workflow run pipeline.yml --ref "${GITHUB_REF_NAME}" -f job=update || true
